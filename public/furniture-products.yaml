# 표시되는 상품 정보입니다. 저장 후 카드를 다시 열면 반영됩니다. 배포된 사이트는 이 파일을 포함해 재배포하세요.
# price는 쉼표 없는 숫자, currency는 KRW/USD 등의 통화 코드입니다.
# placeholder를 false로 바꾸면 '예시 상품 정보' 표시가 사라집니다.
# url이 있는 가구(실제 판매 상품)만 판매 사이트 버튼이 보입니다. url이 없으면 버튼 대신
# "고객 소유 가구이므로 판매하지 않습니다"가 표시됩니다. 그래서 defaults에는 url을 두지 않습니다.
